# Render Blueprint — despliega BD + API + SPA de una sola vez.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: portafolio-fsa-db
    databaseName: portafolio_fsa
    user: fsa
    plan: free
    postgresMajorVersion: "16"

services:
  # --- Backend (FastAPI) ---
  - type: web
    name: portafolio-fsa-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portafolio-fsa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: BACKEND_CORS_ORIGINS
        # Ajustar al dominio real del frontend tras el primer deploy
        value: '["https://portafolio-fsa-web.onrender.com"]'
      - key: RUN_SEED
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"

  # --- Frontend (Next.js standalone) ---
  - type: web
    name: portafolio-fsa-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        # URL pública de la API (para los rewrites server-side de Next)
        value: https://portafolio-fsa-api.onrender.com
      - key: NODE_ENV
        value: production

# Notas:
# - `DATABASE_URL` de Render viene como postgres://…  El backend usa
#   psycopg v3; añade el sufijo +psycopg si tu plataforma no lo hace:
#   postgresql+psycopg://…  (config.py acepta ambos si se ajusta; ver docs/DEPLOY.md).
# - Render inyecta connectionString como postgresql://  -> en DEPLOY.md se
#   explica cómo forzar el driver psycopg.
