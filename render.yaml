# Render Blueprint — arquitectura híbrida.
#   Render  -> PostgreSQL + API (FastAPI)
#   Vercel  -> Front-End (Next.js)  [ver frontend/vercel.json]
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: portafolio-fsa-db
    databaseName: portafolio_fsa
    user: fsa
    plan: free
    postgresMajorVersion: "16"

services:
  # --- Backend (FastAPI) ---
  - type: web
    name: portafolio-fsa-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portafolio-fsa-db
          property: connectionString      # Render entrega postgresql://...
                                          # config.py lo normaliza a postgresql+psycopg://
      - key: SECRET_KEY
        generateValue: true               # Render genera un valor aleatorio seguro
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DEBUG
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        # ⚠️ Sustituir por la URL real del frontend en Vercel tras el 1er deploy.
        value: '["https://portafolio-fsa.vercel.app"]'
      - key: RUN_SEED
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
