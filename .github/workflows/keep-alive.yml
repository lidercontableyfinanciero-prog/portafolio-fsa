# Mantiene despierta la API en el plan free de Render (se duerme tras 15 min sin
# tráfico y el siguiente login esperaba el arranque en frío). Un solo servicio
# encendido todo el mes cabe en las 750 h gratuitas de Render.
name: keep-alive-api

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 https://portafolio-fsa-api.onrender.com/health && exit 0
            sleep 20
          done
          echo "La API no respondió" && exit 1
