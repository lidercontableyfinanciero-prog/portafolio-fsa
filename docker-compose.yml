services:
  db:
    image: postgres:16-alpine
    container_name: portafolio_fsa_db
    environment:
      POSTGRES_DB: portafolio_fsa
      POSTGRES_USER: fsa
      POSTGRES_PASSWORD: fsa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsa -d portafolio_fsa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: portafolio_fsa_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://fsa:fsa@db:5432/portafolio_fsa
      SECRET_KEY: change-me-in-production-with-a-32-byte-random-string
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      SEED_DATA_DIR: /app/seed_data
      RUN_SEED: "1"           # siembra al primer arranque (usa ./Referencias)
    ports:
      - "8000:8000"
    volumes:
      - ./Referencias:/app/seed_data:ro
    profiles: ["full"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: portafolio_fsa_web
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    profiles: ["full"]

volumes:
  pgdata:
